# Cada día renueva los respaldos de los datos en vivo del menú (órbita de Terra y eventos de
# NASA EONET) en frontend/public/datos/. La app los usa si no hay internet o la API falla.
name: Respaldos en vivo
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar-tle.mjs
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/datos/terra-tle.txt public/datos/eonet-respaldo.json
          git diff --cached --quiet || (git commit -m "Respaldos en vivo del $(date -u +%F)" && git push)
